name: Release builds

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package Windows app image
        shell: pwsh
        run: .\package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: out/dist/*-win-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package macOS app image
        shell: bash
        run: ./package-macos.sh "${{ steps.version.outputs.version }}"

      - name: Upload macOS release archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: out/dist/*-mac.zip

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
