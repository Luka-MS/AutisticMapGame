name: CI

on:
  push:
    branches: [main, developer]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: |
          mkdir -p out/classes
          javac -encoding UTF-8 -d out/classes $(find src -name '*.java')
          cp -r res/* out/classes/

      - name: Unit tests
        run: java -cp out/classes mapgame.tools.SelfTest

      - name: Save/load round trip
        run: java -cp out/classes mapgame.tools.SaveCheck

      - name: AI balance smoke test
        run: java -cp out/classes mapgame.tools.BalanceCheck random 1 5
